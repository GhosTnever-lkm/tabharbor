name: Package TabHarbor

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run check
      - name: Package extension
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          zip -r "dist/TabHarbor-v${version}.zip" manifest.json popup.html popup.css popup.mjs core.mjs README.md LICENSE
          sha256sum "dist/TabHarbor-v${version}.zip" > "dist/TabHarbor-v${version}.sha256"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "TabHarbor $tag" --generate-notes
          fi
          gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber

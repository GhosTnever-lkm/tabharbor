name: Check TabHarbor

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run check
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('manifest.json','utf8'))"
